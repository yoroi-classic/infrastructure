apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: morrowwallet-backend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Values.backendRelease | quote }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.kongNamespace | quote }}
      ports:
        - protocol: TCP
          port: 3010
