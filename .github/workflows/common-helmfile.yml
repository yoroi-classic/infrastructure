name: common-helmfile

on:
  workflow_call:
    inputs:
      arguments:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: morrowwallet-helmfile-bl-demeter
  cancel-in-progress: false

jobs:
  helmfile:
    if: github.ref == 'refs/heads/main'
    environment: helmfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate operation
        env:
          OPERATION: ${{ inputs.arguments }}
        run: |
          case "$OPERATION" in diff|apply) ;; *) exit 1 ;; esac
      - name: Install SOPS
        uses: mdgreenwald/mozilla-sops-action@d9714e521cbaecdae64a89d2fdd576dd2aa97056 # v1.6.0
        with:
          version: 3.11.0
      - name: Prepare deployment configuration
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          umask 077
          sops --decrypt --in-place config.yaml
          python3 scripts/check-helmfile-config.py --deploy
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import yaml
          cluster = yaml.safe_load(Path("config.yaml").read_text())["helmfile"]["cluster"]
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for key in ("project", "name", "location", "context"):
                  value = cluster[key]
                  if not isinstance(value, str) or "\n" in value or "\r" in value:
                      raise SystemExit("Invalid cluster setting")
                  output.write("GKE_" + key.upper() + "=" + value + "\n")
          PYTHON
      - name: Install kubectl
        uses: azure/setup-kubectl@0c5e050edfed71b2b50731ab044d42489d51c129 # v4.0.0
        with:
          version: v1.32.3
      - name: GKE authentication
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Get bl-demeter credentials
        id: cluster
        uses: google-github-actions/get-gke-credentials@d0cee45012069b163a631894b98904a9e6723729 # v2.3.3
        with:
          project_id: ${{ env.GKE_PROJECT }}
          cluster_name: ${{ env.GKE_NAME }}
          location: ${{ env.GKE_LOCATION }}
          context_name: ${{ env.GKE_CONTEXT }}
      - name: Verify shared ingress prerequisites
        run: |
          kubectl --context "$GKE_CONTEXT" get ingressclass kong
          kubectl --context "$GKE_CONTEXT" get crd issuers.cert-manager.io
          kubectl --context "$GKE_CONTEXT" --namespace kong get services -o json |
            jq '[.items[] | select(.spec.type == "LoadBalancer") | {name: .metadata.name, addresses: .status.loadBalancer.ingress}]'
      - name: Run Helmfile
        uses: helmfile/helmfile-action@712000e3d4e28c72778ecc53857746082f555ef3 # v2.0.4
        with:
          helmfile-version: v1.1.5
          helm-version: v3.17.3
          helm-plugins: https://github.com/databus23/helm-diff --version v3.12.5
          helmfile-auto-init: 'false'
          helmfile-workdirectory: helmfile-app
          helmfile-args: '-e bl-demeter ${{ inputs.arguments }}'
      - name: Check rollout and certificates
        if: inputs.arguments == 'apply'
        run: python3 scripts/verify-helmfile.py
      - name: Restore encrypted configuration
        if: always()
        run: git restore -- config.yaml
