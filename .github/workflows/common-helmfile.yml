name: common-helmfile

on:
  workflow_call:
    inputs:
      arguments:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

concurrency:
  group: morrowwallet-helmfile-bl-demeter
  cancel-in-progress: false
  # Keep every waiting run; the default replaces a pending run with a newer one.
  queue: max

jobs:
  helmfile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HELM_DRIVER: configmap
    steps:
      # Deploy the current tip of main, not the triggering commit, so the last
      # queued run always deploys the newest merge whatever order runs start in.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Validate operation
        env:
          OPERATION: ${{ inputs.arguments }}
        run: |
          case "$OPERATION" in diff|apply) ;; *) exit 1 ;; esac
      - name: Prepare deployment configuration
        env:
          OPERATION: ${{ inputs.arguments }}
        run: python3 scripts/check-helmfile-config.py --deploy --operation "$OPERATION" --github-env "$GITHUB_ENV"
      - name: Install kubectl
        uses: azure/setup-kubectl@0c5e050edfed71b2b50731ab044d42489d51c129 # v4.0.0
        with:
          version: v1.32.3
      - name: Validate workload identity configuration
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT_EMAIL: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
        run: |
          test -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" || { echo "::error::Set the repository Actions variable GCP_WORKLOAD_IDENTITY_PROVIDER"; exit 1; }
          test -n "$GCP_SERVICE_ACCOUNT_EMAIL" || { echo "::error::Set the repository Actions variable GCP_SERVICE_ACCOUNT_EMAIL"; exit 1; }
      - name: GKE authentication
        id: auth
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
      - name: Verify the authenticated deployment project
        env:
          OPERATION: ${{ inputs.arguments }}
          AUTHENTICATED_PROJECT: ${{ steps.auth.outputs.project_id }}
        run: python3 scripts/check-helmfile-config.py --deploy --operation "$OPERATION" --authenticated-project "$AUTHENTICATED_PROJECT"
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.GKE_PROJECT }}
      - name: Get bl-demeter credentials
        id: cluster
        uses: google-github-actions/get-gke-credentials@d0cee45012069b163a631894b98904a9e6723729 # v2.3.3
        with:
          project_id: ${{ env.GKE_PROJECT }}
          cluster_name: ${{ env.GKE_NAME }}
          location: ${{ env.GKE_LOCATION }}
          context_name: ${{ env.GKE_CONTEXT }}
      - name: Verify shared ingress prerequisites
        run: |
          kubectl --context "$GKE_CONTEXT" get ingressclass kong
          kubectl --context "$GKE_CONTEXT" get crd issuers.cert-manager.io
          kubectl --context "$GKE_CONTEXT" --namespace kong get service "$KONG_PROXY_SERVICE" -o json |
            jq -e 'if .spec.type != "LoadBalancer" or .spec.externalTrafficPolicy != "Local" then
              error("Kong proxy must preserve client addresses: LoadBalancer with externalTrafficPolicy Local required")
              else {name: .metadata.name, addresses: [.status.loadBalancer.ingress[]? |
              select((.ip // "") != "" or (.hostname // "") != "")]} |
              if (.addresses | length) > 0 then . else error("Kong has no assigned load-balancer address") end end'
          kubectl --context "$GKE_CONTEXT" --namespace kong get pods -l "$KONG_POD_SELECTOR" -o json |
            python3 scripts/check-kong.py
          count=$(kubectl --context "$GKE_CONTEXT" --namespace kong get pods -l "$KONG_POD_SELECTOR" -o 'go-template={{len .items}}')
          test "$count" -gt 0
          kubectl --context "$GKE_CONTEXT" --namespace kong wait pods -l "$KONG_POD_SELECTOR" --for=condition=Ready --timeout=60s
      - name: Install Helmfile
        uses: helmfile/helmfile-action@712000e3d4e28c72778ecc53857746082f555ef3 # v2.0.4
        with:
          helmfile-version: v1.1.5
          helm-version: v3.17.3
          helm-plugins: https://github.com/databus23/helm-diff --version v3.12.5
          helmfile-auto-init: 'false'
          helmfile-workdirectory: helmfile-app
          helmfile-args: '--version'
      - name: Render and validate published charts
        run: |
          helmfile -f helmfile-app/helmfile.yaml.gotmpl -e bl-demeter template > "$RUNNER_TEMP/rendered.yaml"
          python3 scripts/check-helmfile-render.py --config helmfile-app/values.yaml "$RUNNER_TEMP/rendered.yaml"
      - name: Run Helmfile
        env:
          OPERATION: ${{ inputs.arguments }}
        run: helmfile -f helmfile-app/helmfile.yaml.gotmpl -e bl-demeter "$OPERATION"
      - name: Check rollout and certificates
        if: inputs.arguments == 'apply'
        run: python3 scripts/verify-helmfile.py
