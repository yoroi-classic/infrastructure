name: test-terraform

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - config.yaml
      - .sops.yaml
      - terraform/**
      - scripts/**
      - tests/**
      - .github/workflows/*terraform.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: ./terraform

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate -no-color
      - run: terraform -chdir=bootstrap init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=bootstrap validate -no-color
      - name: Check CI scripts
        working-directory: .
        run: shellcheck scripts/*.sh
      - name: Test bootstrap recovery
        working-directory: .
        run: python3 -m unittest discover -s tests
